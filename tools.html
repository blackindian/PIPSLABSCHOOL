<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Risk tools | PIPSLAB Trading School</title><meta name=description content="Position size, reward to risk and trade journal."><link rel=icon href=logo.jpg><link rel=preconnect href=https://fonts.googleapis.com><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel=stylesheet><link rel=stylesheet href=style.css></head><body data-page=tools><header class=top id=nav></header><main>
<section><div class=w><h1>Risk tools</h1><p>Decide your risk before you enter. Nothing you type leaves your device.</p><div class=grid>
<div class="card calc"><h3>Your account</h3><label for=bal>Balance ($)</label><input id=bal type=number value=1000 min=0><label for=rk>Risk per trade (%)</label><input id=rk type=number value=1 step=.1 min=0><label for=dl>Daily loss limit (%)</label><input id=dl type=number value=3 step=.5 min=0><div class=out id=o2></div></div>
<div class="card calc"><h3>Position size</h3><label for=pair>Instrument</label><select id=pair><option>EURUSD<option>GBPUSD<option>AUDUSD<option>XAUUSD<option>USDJPY</select><label for=st>Stop distance (pips)</label><input id=st type=number value=20 min=0><label for=pv>Pip value per 1.00 lot ($)</label><input id=pv type=number value=10 step=.1><small>Check this with your broker. For gold, 1 pip is a $0.10 move.</small><div class=out id=o1></div></div>
<div class="card calc"><h3>Reward to risk</h3><label for=en>Entry price</label><input id=en type=number step=any><label for=sl>Stop price</label><input id=sl type=number step=any><label for=tp>Target price</label><input id=tp type=number step=any><div class=out id=o3></div></div></div></div></section>
<section class=alt><div class=w><h2>Trade journal</h2><div class=grid><div class=card><label for=jp>Pair</label><input id=jp placeholder=XAUUSD><label for=jr>Result in R (use a minus for a loss)</label><input id=jr type=number step=.1 placeholder=2><label for=jn>Note</label><input id=jn placeholder="What did you do well or badly?"><p></p><button class="btn g" id=add>Add trade</button> <button class="btn o" id=clr>Clear journal</button></div><div class=card><div class=out id=js></div><div id=jl></div></div></div></div></section>
</main><footer id=foot></footer><script src=data.js></script><script src=app.js></script></body></html>
